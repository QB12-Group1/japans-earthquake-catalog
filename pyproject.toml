[project]
name = "japans-earthquake-catalog"
version = "0.1.0"
description = "A scraper and analyzer for Japan's earthquake data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "selenium>=4.46.0",
    "sqlalchemy>=2.0.51",
    "word2number>=1.1",
]

[dependency-groups]
dev = ["pre-commit>=4.6.1", "pyright>=1.1.411", "ruff>=0.16.0"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long
    "B008", # function calls in defaults
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
